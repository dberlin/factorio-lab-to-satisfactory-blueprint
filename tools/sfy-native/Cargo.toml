[package]
name = "sfy-native"
version = "0.1.0"
edition = "2021"
description = "Read Satisfactory's native hologram constants out of the shipped DLL using its PDB"
publish = false

[dependencies]
anyhow = "1"
goblin = "0.9"
iced-x86 = { version = "1", default-features = false, features = [
    "std",
    "decoder",
    "instr_info",
    "intel",
] }
pdb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = false
